<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="小镇梦想家 · 终端风 banner">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="rgba(201,232,148,0.075)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="26%" cy="38%" r="64%">
      <stop offset="0%" stop-color="rgba(201,232,148,0.18)" />
      <stop offset="55%" stop-color="rgba(201,232,148,0.035)" />
      <stop offset="100%" stop-color="rgba(201,232,148,0)" />
    </radialGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(13,16,15,0)" />
      <stop offset="100%" stop-color="rgba(13,16,15,0.9)" />
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(201,232,148,0.45)" />
      <stop offset="45%" stop-color="rgba(201,232,148,0.10)" />
      <stop offset="100%" stop-color="rgba(201,232,148,0)" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0d100f" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <text x="1150" y="800" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace"
        font-size="300" font-weight="700" fill="rgba(201,232,148,0.10)">&#62;_</text>

  <rect x="120" y="132" width="360" height="1" fill="url(#rule)" />

  <rect width="1600" height="900" fill="url(#fade)" />
</svg>