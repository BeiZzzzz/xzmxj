nav:
  logo: /img/avatar.jpg
  display_title: true
  fixed: true

menu:
  首页: / || fas fa-house
  归档: /archives/ || fas fa-box-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-circle-user

social:
  fab fa-github: https://github.com/BeiZzzzz || GitHub || '#24292e'

favicon: /img/favicon-terminal.svg

avatar:
  img: /img/avatar.jpg
  effect: true

index_img: /img/mhwgon-banner.svg
archive_img: /img/mhwgon-banner.svg
default_top_img: /img/mhwgon-banner.svg
footer_img: false

subtitle:
  enable: true
  effect: true
  sub:
    - 分享技术笔记
    - 记录安全学习
    - 构建自己的知识栈

code_blocks:
  theme: darker
  macStyle: true
  copy: true
  language: true
  shrink: false
  fullpage: false
  word_wrap: false

index_layout: 3

toc:
  post: true
  number: true
  expand: false
  scroll_percent: true

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

aside:
  enable: true
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 专注记录有用、可复用的技术内容
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/BeiZzzzz
  card_announcement:
    # 侧栏已由 source/_data/widget.yml 的仿终端卡片承载欢迎信息，这里关闭避免重复
    enable: false
    content: 欢迎来到 小镇梦想家，这里会持续更新技术学习与实践记录。
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 30
    color: true
  card_archives:
    enable: true
    type: monthly
    format: YYYY 年 MM 月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026/06/01 00:00:00

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

rightside_scroll_percent: true

copy:
  enable: true
  copyright:
    enable: false

wordcount:
  enable: false

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

math:
  use:
  per_page: true

search:
  use: local_search
  placeholder: 输入关键词搜索文章
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8

share:
  use: sharejs

comments:
  use:

theme_color:
  enable: true
  # 终端风配色：信号绿主色 + 近黑底
  main: "#c9e894"
  paginator: "#8ab4ff"
  button_hover: "#c9e894"
  text_selection: "#c9e894"
  link_color: "#8ab4ff"
  meta_color: "#7d8781"
  hr_color: "#272d29"
  code_foreground: "#c9e894"
  code_background: "rgba(11, 14, 12, 0.9)"
  toc_color: "#c9e894"
  blockquote_padding_color: "#c9e894"
  blockquote_background_color: "#141816"
  scrollbar_color: "#3a423c"
  meta_theme_color_light: "#f2f5ef"
  meta_theme_color_dark: "#0d100f"

rounded_corners_ui: true

preloader:
  enable: true
  source: 1

enter_transitions: true
# 终端审美默认深色；右上角按钮仍可切回浅色版
display_mode: dark

font:
  global_font_size: 15px
  code_font_size: 13px
  font_family: "'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
  code_font_family: "'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"

lightbox: medium_zoom

series:
  enable: true

mermaid:
  enable: true
  code_write: true
  open_in_new_tab: true
  zoom_pan: true

note:
  style: flat
  icons: true
  border_radius: 6

snackbar:
  enable: true
  position: bottom-left

instantpage: true

lazyload:
  enable: true
  native: false
  field: site
  blur: true

structured_data:
  enable: true
  alternate_name:
    - 小镇梦想家 Blog
    - 小镇梦想家 技术博客

# 页脚状态行（终端风）
footer:
  custom_text: '<span class="term-status">SYSTEM STATUS: <em>ONLINE</em></span>'

# 终端风皮肤：自定义样式表 + 背景命令流 + 首页 hero 增强
# 注意 1：这里的路径包含站点 root（/xzmxj/），若仓库改名需同步修改
# 注意 2：?v= 是缓存版本号。这三个资源是固定文件名，GitHub Pages 会返回
#         Cache-Control: max-age=600，浏览器在缓存期内不会重新拉取，
#         导致改动"看起来没生效"。每次改动这三个文件后，请递增此版本号，
#         浏览器就会立即获取新版本。
inject:
  head:
    - <link rel="stylesheet" href="/xzmxj/css/terminal.css?v=20261013">
  bottom:
    - <script src="/xzmxj/js/terminal-bg.js?v=20261013" defer></script>
    - <script src="/xzmxj/js/hero-glow.js?v=20261013" defer></script>
